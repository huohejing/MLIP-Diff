# Minimal end-to-end sanity check: one molecule, demo target (3ctj).
#
# Guidance parameters mirror those used for the reported results (see the
# per-system configs under data/): start_step=25 with interval=1 means the
# physical correction is applied on each of the last 25 denoising steps.
# readiness=true enables the chemistry-aware proxy reconstruction (Sec. 2.5);
# without it the loader falls back to the legacy path, which does not build a
# proxy and hard-codes the proxy confidence to 1.0.
#
# Two pocket files are needed, and they serve different roles:
#   model.target                      non-hydrogenated pocket -> DiffGui input
#   physical_guidance.pocket_pdb      hydrogenated pocket     -> MACE environment

model:
  checkpoint: ckpt/trained.pt
  target: sample/3ctj_pocket.pdb
  ligand: "None"
  frag: "None"
  gen_mode: denovo
  logp: 2.0
  tpsa: 100
  sa: 1.0
  qed: 0.8
  aff: 12.0

bond_predictor: ckpt/bond_trained.pt

# Unused when sample.mode=pocket (the pocket comes from model.target).
# Only consulted when sample.mode=test.
data:
  name: protein_ligand
  path: data/PDBbind_v2020_pocket10
  split: data/PDBbind_pocket10_split.pt
  protein_root: data/PDBbind_v2020
  dataset: pdbbind
  transform:
    ligand_atom_mode: aromatic
    random_rot: false
    sample: false

sample:
  seed: 777
  batch_size: 1
  num_mols: 1
  save_traj_prob: 0.0
  sample: true
  sample_method: priori
  mode: pocket
  test_id: 0
  add_edge: "None"
  gui_strength: 3.0
  guidance: ["uncertainty", 0.0001]

  physical_guidance:
    enabled: true
    mode: mace_only
    complex_force: true
    dir_scale: 4.0
    tanh_c: 3.0
    w_max: 3.0
    quantile: 0.90
    start_step: 25
    interval: 1
    readiness: true
    mace_device: cuda
    # Not tilde-expanded by the loader — use an absolute path, or export
    # MLIPDIFF_MACE_MODEL and omit this line.
    mace_model_path: ~/.cache/mace/MACE-OFF24_medium.model
    overall_scale: 0.1
    lambda_lig: 0.0
    lambda_pocket: 0.0
    pocket_pdb: sample/3ctj_pocket_h.pdb
